services:
  - type: web
    name: gigpulse-api
    runtime: python
    buildCommand: "pip install -e packages/gigpulse-core && pip install -r services/api/requirements.txt"
    startCommand: "uvicorn api.main:app --app-dir services/api --host 0.0.0.0 --port $PORT"
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEMO_MODE
        value: "true"
      - key: GIGPULSE_DB_PATH
        value: "gigpulse.db"
      # To connect to Neon Free PostgreSQL, set DATABASE_URL in Render Dashboard:
      # - key: DATABASE_URL
      #   value: "postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require"

