[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gigpulse-core"
version = "0.1.0"
description = "Core domain logic, schema, metrics, and ML models for GigPulse AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gigpulse_core*"]

